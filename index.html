<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ديسكو الصوت 🕺🎶</title>
    <style>
        body {
            background: #111; /* خلفية سوداء بالبداية كأننا في نادي */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* تأثير أنوار الديسكو المتحركة يمين ويسار */
        @keyframes discoLights {
            0% {
                background: linear-gradient(90deg, #ff0055, #00ffcc, #ff00ff, #ffff00);
                background-size: 400% 400%;
                background-position: 0% 50%;
            }
            50% {
                background: linear-gradient(90deg, #00ffff, #ff0055, #ffff00, #00ffcc);
                background-size: 400% 400%;
                background-position: 100% 50%;
            }
            100% {
                background: linear-gradient(90deg, #ff0055, #00ffcc, #ff00ff, #ffff00);
                background-size: 400% 400%;
                background-position: 0% 50%;
            }
        }

        /* كلاس الديسكو اللي يتفعل أول ما تضغط الزر */
        body.disco-active {
            animation: discoLights 1.5s infinite linear;
        }

        /* الزر الدائري */
        #soundBtn {
            width: 200px;
            height: 200px;
            font-size: 24px;
            background: #ff4757;  
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            font-weight: bold;
            transition: transform 0.1s ease;
            text-align: center;
            line-height: 1.2;
            z-index: 10;
        }
        #soundBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- الزر الدائري -->
    <button id="soundBtn">اضغط للديسكو<br>والصوت 🕺</button>

    <!-- ملف الصوت -->
    <audio id="myAudio" src="anime ahh.mp3" preload="auto"></audio>

    <script>
        const btn = document.getElementById('soundBtn');
        const audio = document.getElementById('myAudio');
        const body = document.body;

        btn.addEventListener('click', function() {
            audio.currentTime = 0;
            
            audio.play().then(() => {
                // أول ما يشتغل الصوت، شغل أنوار الديسكو المتحركة
                body.classList.add('disco-active');
                btn.style.background = '#000000'; // يصير لون الزر أسود عشان تبرق الألوان حوله
                btn.innerText = "الدوع شغال! 🎸";
            }).catch(function'error', (error) => {
                console.error("خطأ بالتشغيل:", error);
            });
        });

        // أول ما ينتهي الصوت، تطفي أنوار الديسكو ويرجع الوضع طبيعي
        audio.addEventListener('ended', function() {
            body.classList.remove('disco-active');
            body.style.background = '#111';
            btn.style.background = '#ff4757';
            btn.innerText = "اضغط للديسكو\nوالصوت 🕺";
        });
    </script>

</body>
</html>
