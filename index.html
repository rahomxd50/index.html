<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Chaos Party Sound Button</title>
    <style>
        :root {
            --bg-color: #111;
            --text-color: #fff;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
            font-family: Arial, sans-serif;
            transition: background 0.3s ease;
        }

        /* تأثير اهتزاز الشاشة عند الضغط */
        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 10px); }
            40% { transform: translate(10px, -10px); }
            60% { transform: translate(-5px, 5px); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0, 0); }
        }

        .shake-screen {
            animation: shake 0.3s ease;
        }

        /* الزر الرئيسي */
        #soundBtn {
            width: 200px;
            height: 200px;
            font-size: 20px;
            background: #ff4757;  
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            z-index: 100;
            box-shadow: 0 0 25px rgba(255,255,255,0.3);
            transition: transform 0.1s ease, background 0.3s ease;
        }
        #soundBtn:active {
            transform: scale(0.95);
        }

        /* عداد الضغطات وتغيير الثيم */
        .ui-panel {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 15px;
            z-index: 100;
            align-items: center;
        }

        .counter-badge, .control-btn {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* شريط التحكم بالصوت أسفل الشاشة */
        .volume-container {
            position: absolute;
            bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        .volume-container input[type="range"] {
            cursor: pointer;
            accent-color: #ff4757;
        }

        /* الأشكال والورود */
        .shape {
            position: absolute;
            pointer-events: none;
            animation: fly linear infinite;
        }
        @keyframes fly {
            0% { transform: translate(var(--sx), var(--sy)) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(var(--ex), var(--ey)) rotate(var(--rot)); opacity: 0; }
        }
        .flower {
            position: absolute;
            pointer-events: none;
            animation: bloom linear forwards;
        }
        @keyframes bloom {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            30% { transform: scale(1) rotate(180deg); opacity: 1; }
            70% { transform: scale(1) rotate(360deg); opacity: 1; }
            100% { transform: scale(0) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- لوحة العداد وزر الثيم -->
    <div class="ui-panel">
        <div class="counter-badge" id="counterBadge">Clicks: 0</div>
        <button class="control-btn" id="themeBtn">☀️ Light Mode</button>
    </div>

    <!-- زر الصوت الرئيسي -->
    <button id="soundBtn">Click Me! 💥</button>
    <audio id="myAudio" src="anime ahh.mp3" preload="auto"></audio>

    <!-- شريط التحكم بالصوت -->
    <div class="volume-container">
        <span>🔊 Volume:</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
    </div>

    <script>
        const btn = document.getElementById('soundBtn');
        const audio = document.getElementById('myAudio');
        const counterBadge = document.getElementById('counterBadge');
        const themeBtn = document.getElementById('themeBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        
        let clickCount = 0;
        let timer1, timer2;
        let isLightMode = false;

        // ميزة 1: التحكم بمستوى الصوت
        volumeSlider.addEventListener('input', function() {
            audio.volume = volumeSlider.value;
        });

        // ميزة 2: زر تغيير الوضع (فاتح / مظلم)
        themeBtn.addEventListener('click', function() {
            isLightMode = !isLightMode;
            if (isLightMode) {
                document.documentElement.style.setProperty('--bg-color', '#f5f6fa');
                document.documentElement.style.setProperty('--text-color', '#2f3640');
                themeBtn.innerText = "🌙 Dark Mode";
                themeBtn.style.background = "rgba(0, 0, 0, 0.1)";
                themeBtn.style.color = "#2f3640";
            } else {
                document.documentElement.style.setProperty('--bg-color', '#111');
                document.documentElement.style.setProperty('--text-color', '#fff');
                themeBtn.innerText = "☀️ Light Mode";
                themeBtn.style.background = "rgba(255, 255, 255, 0.1)";
                themeBtn.style.color = "#fff";
            }
        });

        // الحدث عند ضغط زر الصوت الرئيسي
        btn.addEventListener('click', function() {
            audio.currentTime = 0;
            audio.play().then(() => {
                btn.style.background = '#2ed573';
                btn.innerText = "Party! 🔥";
            }).catch(e => {
                console.log("Audio play error:", e);
                alert("Error playing audio. Make sure 'anime ahh.mp3' is uploaded in GitHub.");
            });

            // ميزة 3: عداد الضغطات
            clickCount++;
            counterBadge.innerText = `Clicks: ${clickCount}`;

            // ميزة 4: اهتزاز الشاشة مع كل ضغطة
            document.body.classList.add('shake-screen');
            setTimeout(() => {
                document.body.classList.remove('shake-screen');
            }, 300);

            if (timer1) clearInterval(timer1);
            if (timer2) clearInterval(timer2);

            // توليد الأشكال السريعة والفوضوية
            timer1 = setInterval(() => {
                const el = document.createElement('div');
                el.className = 'shape';
                const size = Math.random() * 40 + 20;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                
                const colors = ['#ff0055', '#00ffcc', '#ffff00', '#ff00ff', '#00ffff'];
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                const sx = Math.random() * window.innerWidth;
                const sy = Math.random() * window.innerHeight;
                el.style.setProperty('--sx', sx + 'px');
                el.style.setProperty('--sy', sy + 'px');
                el.style.setProperty('--ex', (sx + (Math.random() - 0.5) * 1000) + 'px');
                el.style.setProperty('--ey', (sy + (Math.random() - 0.5) * 1000) + 'px');
                el.style.setProperty('--rot', (Math.random() * 720) + 'deg');

                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1000);
            }, 40);

            // توليد الورود الددوارة الثابتة
            timer2 = setInterval(() => {
                const fl = document.createElement('div');
                fl.className = 'flower';
                fl.innerHTML = '🌸';
                fl.style.fontSize = (Math.random() * 30 + 25) + 'px';
                fl.style.left = (Math.random() * (window.innerWidth - 50)) + 'px';
                fl.style.top = (Math.random() * (window.innerHeight - 50)) + 'px';
                
                document.body.appendChild(fl);
                setTimeout(() => fl.remove(), 1500);
            }, 300);
        });

        audio.addEventListener('ended', function() {
            clearInterval(timer1);
            clearInterval(timer2);
            btn.style.background = '#ff4757';
            btn.innerText = "Click Me! 💥";
        });
    </script>
</body>
</html>
