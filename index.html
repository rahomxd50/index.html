<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disco Sound Button</title>
    <style>
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* تأثير أنوار الديسكو المتحركة يمين ويسار */
        @keyframes discoLights {
            0% {
                background: linear-gradient(90deg, #ff0055, #00ffcc, #ff00ff, #ffff00);
                background-size: 400% 400%;
                background-position: 0% 50%;
            }
            50% {
                background: linear-gradient(90deg, #00ffff, #ff0055, #ffff00, #00ffcc);
                background-size: 400% 400%;
                background-position: 100% 50%;
            }
            100% {
                background: linear-gradient(90deg, #ff0055, #00ffcc, #ff00ff, #ffff00);
                background-size: 400% 400%;
                background-position: 0% 50%;
            }
        }

        body.disco-active {
            animation: discoLights 1.5s infinite linear;
        }

        #soundBtn {
            width: 200px;
            height: 200px;
            font-size: 22px;
            background: #ff4757;  
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            font-weight: bold;
            transition: transform 0.1s ease, background 0.3s ease;
            text-align: center;
            line-height: 1.3;
            z-index: 10;
        }
        #soundBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button id="soundBtn">Click for Disco<br>and Audio 🕺</button>

    <audio id="myAudio" src="anime ahh.mp3" preload="auto"></audio>

    <script>
        const btn = document.getElementById('soundBtn');
        const audio = document.getElementById('myAudio');
        const body = document.body;

        btn.addEventListener('click', function() {
            audio.currentTime = 0;
            
            audio.play().then(() => {
                body.classList.add('disco-active');
                btn.style.background = '#000000';
                btn.innerText = "Playing... 🔊";
            }).catch(function(error) {
                console.error("Playback error:", error);
            });
        });

        audio.addEventListener('ended', function() {
            body.classList.remove('disco-active');
            body.style.background = '#111';
            btn.style.background = '#ff4757';
            btn.innerText = "Click for Disco\nand Audio 🕺";
        });
    </script>

</body>
</html>
