<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>زر الصوت</title>
    <style>
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        button {
            padding: 30px 60px;
            font-size: 28px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button id="btn">اضغط هنا للصوت 🎵</button>

    <audio id="snd" src="anime-ahh.mp3" preload="auto"></audio>

    <script>
        const b = document.getElementById("btn");
        const s = document.getElementById("snd");

        b.addEventListener("click", async () => {
            try {
                s.currentTime = 0;
                await s.play();
            } catch (error) {
                console.error("فشل تشغيل الصوت:", error);
            }
        });
    </script>

</body>
</html>
