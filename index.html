<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشاركة الموقع</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; padding-top: 20vh; background: #f4f4f9; }
        button { background: #2563eb; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        #status { margin-top: 20px; color: #555; }
    </style>
</head>
<body>

    <h2>مشاركة موقعك الجغرافي</h2>
    <p>اضغط على الزر أدناه للسماح بمشاركة موقعك معنا:</p>
    
    <button onclick="shareLocation()">مشاركة موقعي</button>
    <p id="status"></p>

    <script>
        function shareLocation() {
            const statusText = document.getElementById("status");
            
            if (!navigator.geolocation) {
                statusText.innerHTML = "متصفحك لا يدعم تحديد الموقع.";
                return;
            }

            statusText.innerHTML = "جاري طلب إذن الوصول للموقع...";

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;

                    statusText.innerHTML = "تم تحديد الموقع بنجاح، جاري الإرسال...";

                    // إرسال البيانات إلى السيرفر الخاص بك (Backend)
                    fetch('/api/save-location', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ latitude: lat, longitude: lon })
                    })
                    .then(response => {
                        if (response.ok) {
                            statusText.innerHTML = "شكراً لك، تم إرسال موقعك بنجاح!";
                        } else {
                            statusText.innerHTML = "حدث خطأ أثناء الإرسال.";
                        }
                    });
                },
                function(error) {
                    statusText.innerHTML = "تم رفض إذن الوصول إلى الموقع من قبل المستخدم.";
                },
                { enableHighAccuracy: true }
            );
        }
    </script>

</body>
</html>
