<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زر الصوت التفاعلي</title>
    <style>
        body {
            background: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        #soundBtn {
            width: 200px;
            height: 200px;
            font-size: 24px;
            /* اللون الافتراضي: أحمر */
            background: #ff4757;  
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: bold;
            transition: background 0.3s ease, transform 0.1s ease;
            text-align: center;
            line-height: 1.2;
        }
        #soundBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- الزر الدائري -->
    <button id="soundBtn">اضغط هنا<br>للصوت 🎵</button>

    <!-- ملف الصوت -->
    <audio id="myAudio" src="anime ahh.mp3" preload="auto"></audio>

    <script>
        const btn = document.getElementById('soundBtn');
        const audio = document.getElementById('myAudio');

        btn.addEventListener('click', function() {
            // إعادة الصوت من البداية لو ضغط عليه وهو شغال
            audio.currentTime = 0;
            
            audio.play().then(() => {
                // أول ما يبدأ الصوت، تحول لونه إلى الأزرق
                btn.style.background = '#2ed573'; // حطيت لك أخضر فريش، أو تقدر تخليه أزرق #1e90ff
                btn.innerText = "شغال... 🔊";
            }).catch(function(error) {
                console.error("تعذر تشغيل الصوت:", error);
            });
        });

        // أول ما ينتهي الصوت تماماً، يرجع الزر لونه أحمر وشكله الأصلي
        audio.addEventListener('ended', function() {
            btn.style.background = '#ff4757'; // يرجع أحمر
            btn.innerText = "اضغط هنا\nللصوت 🎵";
        });
    </script>

</body>
</html>
