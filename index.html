<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تنبيه</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding-top: 20vh;
        }
        h1 {
            font-size: 3rem;
            color: #ff4757;
        }
    </style>
</head>
<body>

    <h1 id="msg">جاري فحص موقعك...</h1>

    <script>
        // أول ما يفتح الرابط، تطلع له نافذة منبثقة في وجهه فوراً
        alert("أنت وينك؟!");

        // أو حركة أذكاء: نجيب مكانه الجغرافي الحقيقي ونعرضه له على الشاشة
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                let lat = position.coords.latitude;
                let lon = position.coords.longitude;
                document.getElementById("msg").innerHTML = "لقد تم تحديد مكانك! <br> خط العرض: " + lat + "<br> خط الطول: " + lon;
            }, function(error) {
                document.getElementById("msg").innerHTML = "رفضت إعطاء موقعك يا بطل!";
            });
        }
    </script>

</body>
</html>
