<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Chaos Party</title>
    <style>
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* الزر الدائري في المنتصف */
        #soundBtn {
            width: 200px;
            height: 200px;
            font-size: 22px;
            background: #ff4757;  
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            font-weight: bold;
            transition: transform 0.1s ease, background 0.3s ease;
            text-align: center;
            line-height: 1.3;
            z-index: 100;
        }
        #soundBtn:active {
            transform: scale(0.95);
        }

        /* الأشكال التي تتحرك بكل مكان بعشوائية */
        .chaos-shape {
            position: absolute;
            pointer-events: none;
            animation: moveAround linear infinite;
        }

        @keyframes moveAround {
            0% {
                transform: translate(var(--start-x), var(--start-y)) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--end-x), var(--end-y)) rotate(var(--rot)) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <button id="soundBtn">Click for Chaos<br>and Audio 💥</button>

    <audio id="myAudio" src="anime ahh.mp3" preload="auto"></audio>

    <script>
        const btn = document.getElementById('soundBtn');
        const audio = document.getElementById('myAudio');
        let chaosInterval = null;

        function spawnShape() {
            const shape = document.createElement('div');
            shape.classList.add('chaos-shape');

            const type = Math.floor(Math.random() * 3); // 0: مربع، 1: مثلث، 2: نجمة
            const size = Math.random() * 45 + 20; 
            const colors = ['#ff0055', '#00ffcc', '#ff00ff', '#ffff00', '#00ffff', '#ff6b81', '#70a1ff'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            shape.style.width = `${size}px`;
            shape.style.height = `${size}px`;

            if (type === 0) {
                // مربع
                shape.style.backgroundColor = randomColor;
                shape.style.borderRadius = '4px';
            } else if (type === 1) {
                // مثلث
                shape.style.width = '0';
                shape.style.height = '0';
                shape.style.borderLeft = `${size / 2}px solid transparent`;
                shape.style.borderRight = `${size / 2}px solid transparent`;
                shape.style.borderBottom = `${size}px solid ${randomColor}`;
            } else {
                // نجمة
                shape.style.backgroundColor = randomColor;
                shape.style.clipPath = 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)';
            }

            // إحداثيات ظهور عشوائية من أي مكان بالشاشة وانطلاقها لكل مكان
            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight;
            const endX = startX + (Math.random() - 0.5) * window.innerWidth * 1.5;
            const endY = startY + (Math.random() - 0.5) * window.innerHeight * 1.5;
            const rotation = Math.random() * 1080 - 540; // دوران مجنون

            shape.style.setProperty('--start-x', `${startX}px`);
            shape.style.setProperty('--start-y', `${startY}px`);
            shape.style.setProperty('--end-x', `${endX}px`);
            shape.style.setProperty('--end-y', `${endY}px`);
            shape.style.setProperty('--rot', `${rotation}deg`);

            const duration = Math.random() * 1.5 + 1; // سرعة الحركة
            shape.style.animationDuration = `${duration}s`;

            document.body.appendChild(shape);

            // حذف الشكل بعد انتهاء حركته لتنظيف الذاكرة
            setTimeout(() => {
                shape.remove();
            }, duration * 1000);
        }

        btn.addEventListener('click', function() {
            audio.currentTime = 0;
            
            audio.play().then(() => {
                btn.style.background = '#2ed573';
                btn.innerText = "Partying! 🔥";

                // إذا كان فيه حلقة قديمة شغالّة نلغيها عشان ما تتلخبط
                if (chaosInterval) clearInterval(chaosInterval);

                // استمرار توليد الأشكال بعشوائية طول فترة تشغيل الأغنية (كل 100 ميلي ثانية شكل جديد)
                chaosInterval = setInterval(spawnShape, 100);

            }).catch(function(error) {
                console.error("Playback error:", error);
            });
        });

        // أول ماتخلص الأغنية يوقف توليد الأشكال ويرجع الزر لوضعه الطبيعي
        audio.addEventListener('ended', function() {
            clearInterval(chaosInterval);
            btn.style.background = '#ff4757';
            btn.innerText = "Click for Chaos\nand Audio 💥";
        });
    </script>

</body>
</html>
