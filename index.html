<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extreme Chaos Party</title>
    <style>
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        #soundBtn {
            width: 200px;
            height: 200px;
            font-size: 22px;
            background: #ff4757;  
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            font-weight: bold;
            transition: transform 0.1s ease, background 0.3s ease;
            text-align: center;
            line-height: 1.3;
            z-index: 100;
        }
        #soundBtn:active {
            transform: scale(0.95);
        }

        /* الأشكال المتحركة السريعة في كل مكان */
        .chaos-shape {
            position: absolute;
            pointer-events: none;
            animation: moveAround linear infinite;
        }

        @keyframes moveAround {
            0% {
                transform: translate(var(--start-x), var(--start-y)) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--end-x), var(--end-y)) rotate(var(--rot)) scale(1.5);
                opacity: 0;
            }
        }

        /* الورد الثابتة التي تلف في مكانها وتختفي */
        .static-flower {
            position: absolute;
            pointer-events: none;
            animation: flowerFadeRotate linear forwards;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes flowerFadeRotate {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(0deg);
            }
            20% {
                opacity: 1;
                transform: scale(1) rotate(180deg);
            }
            80% {
                opacity: 1;
                transform: scale(1) rotate(540deg);
            }
            100% {
                opacity: 0;
                transform: scale(0.2) rotate(720deg);
            }
        }
    </style>
</head>
<body>

    <button id="soundBtn">Click for Extreme Chaos<br>and Audio 🌸💥</button>

    <audio id="myAudio" src="anime ahh.mp3" preload="auto"></audio>

    <script>
        const btn = document.getElementById('soundBtn');
        const audio = document.getElementById('myAudio');
        let chaosInterval = null;
        let flowerInterval = null;

        function spawnShape() {
            const shape = document.createElement('div');
            shape.classList.add('chaos-shape');

            const type = Math.floor(Math.random() * 3);
            const size = Math.random() * 50 + 25; 
            const colors = ['#ff0055', '#00ffcc', '#ff00ff', '#ffff00', '#00ffff', '#ff6b81', '#70a1ff', '#ff9f43'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            shape.style.width = `${size}px`;
            shape.style.height = `${size}px`;

            if (type === 0) {
                shape.style.backgroundColor = randomColor;
                shape.style.borderRadius = '6px';
            } else if (type === 1) {
                shape.style.width = '0';
                shape.style.height = '0';
                shape.style.borderLeft = `${size / 2}px solid transparent`;
                shape.style.borderRight = `${size / 2}px solid transparent`;
                shape.style.borderBottom = `${size}px solid ${randomColor}`;
            } else {
                shape.style.backgroundColor = randomColor;
                shape.style.clipPath = 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)';
            }

            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight;
            const endX = startX + (Math.random() - 0.5) * window.innerWidth * 1.8;
            const endY = startY + (Math.random() - 0.5) * window.innerHeight * 1.8;
            const rotation = Math.random() * 1440 - 720; 

            shape.style.setProperty('--start-x', `${startX}px`);
            shape.style.setProperty('--start-y', `${startY}px`);
            shape.style.setProperty('--end-x', `${endX}px`);
            shape.style.setProperty('--end-y', `${endY}px`);
            shape.style.setProperty('--rot', `${rotation}deg`);

            // حركة أسرع بكثير
            const duration = Math.random() * 0.6 + 0.4; 
            shape.style.animationDuration = `${duration}s`;

            document.body.appendChild(shape);

            setTimeout(() => {
                shape.remove();
            }, duration * 1000);
        }

        function spawnFlower() {
            const flower = document.createElement('div');
            flower.classList.add('static-flower');
            flower.innerHTML = '🌸'; // إيموجي وردة جميلة

            const size = Math.random() * 30 + 30; // حجم الوردة
            flower.style.fontSize = `${size}px`;

            // مكان عشوائي ثابت لا يتحرك يمين أو يسار
            const posX = Math.random() * (window.innerWidth - 80);
            const posY = Math.random() * (window.innerHeight - 80);

            flower.style.left = `${posX}px`;
            flower.style.top = `${posY}px`;

            const duration = Math.random() * 1.5 + 1; // مدة ظهورها ولفها واختفائها
            flower.style.animationDuration = `${duration}s`;

            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, duration * 1000);
        }
