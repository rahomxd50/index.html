<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زر الصوت والخلفية</title>
    <style>
        body {
            /* خلفية بيضاء نفس الصورة */
            background: #eef0f3; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* تصميم النجوم في الخلفية */
        .star {
            position: absolute;
            background-color: #1a2536; /* لون كحلي غامق نفس الصورة */
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            opacity: 0.85;
        }

        /* الزر الدائري في المنتصف */
        #soundBtn {
            width: 200px;
            height: 200px;
            font-size: 24px;
            background: #ff4757;  
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            font-weight: bold;
            transition: background 0.3s ease, transform 0.1s ease;
            text-align: center;
            line-height: 1.2;
            z-index: 10; /* عشان يصير الزر فوق النجوم وما يختفي تحتها */
        }
        #soundBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- خلفية النجوم (تتوزع تلقائياً) -->
    <div class="star" style="top: 10%; left: 15%; width: 90px; height: 90px; transform: rotate(-15deg);"></div>
    <div class="star" style="top: 12%; right: 12%; width: 65px; height: 65px; transform: rotate(10deg);"></div>
    <div class="star" style="top: 40%; left: 8%; width: 85px; height: 85px; transform: rotate(25deg);"></div>
    <div class="star" style="top: 35%; right: 18%; width: 75px; height: 75px; transform: rotate(-10deg);"></div>
    <div class="star" style="bottom: 25%; left: 25%; width: 70px; height: 70px; transform: rotate(15deg);"></div>
    <div class="star" style="bottom: 10%; right: 10%; width: 110px; height: 110px; transform: rotate(-20deg);"></div>

    <!-- الزر الدائري -->
    <button id="soundBtn">اضغط هنا<br>للصوت 🎵</button>

    <!-- ملف الصوت -->
    <audio id="myAudio" src="anime ahh.mp3" preload="auto"></audio>

    <script>
        const btn = document.getElementById('soundBtn');
        const audio = document.getElementById('myAudio');

        btn.addEventListener('click', function() {
            audio.currentTime = 0;
            audio.play().then(() => {
                btn.style.background = '#2ed573'; // يقلب أخضر أثناء التشغيل
                btn.innerText = "شغال... 🔊";
            }).catch(function(error) {
                console.error("تعذر تشغيل الصوت:", error);
            });
        });

        audio.addEventListener('ended', function() {
            btn.style.background = '#ff4757'; // يرجع أحمر لما ينتهي
            btn.innerText = "اضغط هنا\nللصوت 🎵";
        });
    </script>

</body>
</html>
